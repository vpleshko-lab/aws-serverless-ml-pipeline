name: Deploy ML Infrastructure and App via AWS CDK

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Кешування залежностей, щоб деплой відбувався швидше
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      # Node.js (він потрібен для роботи глобального AWS CDK)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      # Налаштування доступів до AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Docker-демон у ранері GitHub Actions (CDK буде збирати образи тут)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ОДНА фінальна команда, яка зробить ВСЕ
      # --require-approval never каже "не запитувати підтвердження (y/n) в терміналі на створення IAM-ролей"
      - name: Deploy CDK Stack
        run: |
          cd infra-cdk
          poetry run cdk deploy --require-approval never
